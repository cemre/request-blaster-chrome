<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request Blaster</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script type="module" src="src/panel.js"></script>
</head>
<body data-state="loading">

<!-- No title row: Chrome's own side panel header already names the extension
     directly above this, and the count lives with the list it counts. -->
<header class="panel-header">
  <nav class="modes">
    <button id="mode-requests" class="mode" data-mode="requests">Requests</button>
    <button id="mode-log" class="mode" data-mode="log" title="Everything you have accepted and rejected">Log</button>
  </nav>

  <!-- In the tab bar's dead space rather than above the list. This band is the
       only pinned one with room to spare, so reporting from here costs no
       pixels and never scrolls away mid-batch — which is what let both of
       hydration's states move into one box. They share it because they are one
       queue: the batch feeds the total, and split across two places they showed
       the same number twice.

       Each label is a static word plus a count span rather than one string,
       because the word is what drops away at narrow widths. -->
  <div id="hydration" class="hydration">
    <div id="hydration-idle" class="hydration-line">
      <span title="Details are follower and post counts, bio, and the exact mutual count. They need one request per person, so they load on demand rather than up front."><span id="hydration-count">0 / 0</span><span class="label-wide"> details</span></span>
      <!-- A link, not a button: this slot reports on the list and offers one
           optional action, which does not warrant a control surface in the
           panel's title band. -->
      <button id="load-batch" class="link-inline" title="Fetch follower counts, posts, bio and exact mutuals for the next batch of rows in view">Load details</button>
    </div>

    <!-- --run-pct drives a rule along the bottom edge rather than a fill behind
         the text. A painted block this size reads as an alert, and a batch
         loading details in the background is not one; an underline that grows
         says the same thing at a fraction of the volume.

         It also costs a layer: nothing is painted behind the label, so the line
         needs no knocked-out second copy the way the toolbar's fill does. The
         text stays one colour throughout. -->
    <div id="hydration-run" class="run-progress" hidden>
      <div class="run-fill"></div>

      <div class="run-line">
        <span class="spinner spinner-inline"></span>
        <span class="run-text"><span class="label-wide">Enriching </span><span id="hydration-run-count"></span></span>
      </div>

      <button id="stop-hydration" class="btn btn-small btn-quiet meter-stop">Stop</button>
    </div>
  </div>
</header>

<div id="banner" class="banner" hidden>
  <span id="banner-text"></span>
  <button id="banner-retry" class="icon-btn" hidden>Retry</button>
  <button id="banner-dismiss" class="icon-btn">Dismiss</button>
</div>

<div class="loading">
  <div class="spinner"></div>
  <span id="loading-text">Loading pending requests…</span>
</div>

<section class="filters">
  <div class="filter-bar">
    <!-- "Following" at every width: it is the word the row chip already uses
         for these same accounts, so it needs no explaining, and it costs a
         third less bar than "Already follow" did. -->
    <label class="toggle-chip">
      <input type="checkbox" id="f-following">
      <span>Following</span>
    </label>

    <label class="select-chip mutuals-chip">
      <!-- Drops away narrow, leaving the value to speak for itself — hence the
           aria-label below, which is the select's only name once this is gone.
           It comes back at the default, where the value is "any" and says
           nothing; the chevron stands in for the select's own, hidden there. -->
      <span class="label-wide">Mutuals</span>
      <svg class="chip-chevron chevron-standin" viewBox="0 0 10 6" width="9" height="6" aria-hidden="true" focusable="false">
        <path d="M1 1.25 5 5l4-3.75" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <!-- A select is as wide as its longest option whether or not that option
           is chosen, so a spelled-out "none (loaded rows)" cost this chip ~60px
           on every panel at every width. The caveat is not lost: the same text
           is in the tooltip, and #enriched-warning states it in full whenever
           the option is actually on. -->
      <select id="f-mutuals" aria-label="Mutuals" title="&quot;none&quot; needs an exact count, so it only matches rows you have loaded details for — an absent &quot;Followed by…&quot; hint does not mean zero mutuals.">
        <option value="0">any</option>
        <option value="none">none</option>
        <option value="1">1+</option>
        <option value="5">5+</option>
        <option value="10">10+</option>
        <option value="50">50+</option>
        <option value="100">100+</option>
      </select>
    </label>

    <div class="popover-host">
      <button id="spam-toggle" type="button" class="chip-button" aria-expanded="false" aria-controls="spam-panel">
        <span>Spam</span><span id="spam-count" class="chip-count" hidden></span>
      </button>

      <div id="spam-panel" class="popover" hidden>
        <!-- Comes off the pending list itself, so unlike the four below it
             filters every row whether or not its details have loaded. -->
        <label class="popover-check">
          <input type="checkbox" id="f-default-pic"><span>No profile pic</span>
        </label>

        <div class="popover-divider"></div>
        <p class="popover-label">Needs loaded details</p>

        <label class="popover-check">
          <span>Followers under</span>
          <input id="f-max-followers" type="number" min="0" step="1" placeholder="—" class="num">
        </label>
        <label class="popover-check"><input type="checkbox" id="f-zero-posts"><span>0 posts</span></label>
        <label class="popover-check"><input type="checkbox" id="f-empty-bio"><span>Empty bio</span></label>
        <label class="popover-check"><input type="checkbox" id="f-bot-ratio"><span>Bot ratio</span></label>
      </div>
    </div>

    <button id="search-toggle" type="button" class="icon-toggle" aria-expanded="false" aria-controls="search" aria-label="Search username or name" title="Search username or name">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
        <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
        <line x1="10.4" y1="10.4" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line>
      </svg>
    </button>
  </div>

  <input id="search" type="search" class="search" placeholder="Search username or name" autocomplete="off" hidden>
</section>

<section class="result-bar">
  <!-- A button, not a checkbox: it performs an action rather than holding a
       state, and its own label already says which way it will go. -->
  <button id="select-all" type="button" class="chip-button">Select all</button>
  <span id="shown-count" class="muted"></span>

  <!-- Names the control, not its value. The open menu marks the current option
       itself, so repeating it on the chip only cost width. The native <select>
       is kept and laid over the chip at zero opacity — the menu then opens
       where and how the OS does it, rather than being reimplemented. -->
  <label class="select-chip select-chip-menu">
    <span>Sort</span>
    <svg class="chip-chevron" viewBox="0 0 10 6" width="9" height="6" aria-hidden="true" focusable="false">
      <path d="M1 1.25 5 5l4-3.75" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <select id="sort" aria-label="Sort order">
      <option value="default">Following, then mutuals</option>
      <option value="newest">Newest request</option>
      <option value="followers">Most followers</option>
    </select>
  </label>
</section>

<section class="log-controls">
  <div class="filter-bar">
    <button class="log-tab" data-kind="all">All</button>
    <button class="log-tab" data-kind="accepted">Accepted</button>
    <button class="log-tab" data-kind="rejected">Rejected</button>

    <button id="log-search-toggle" type="button" class="icon-toggle" aria-expanded="false" aria-controls="log-search" aria-label="Search username" title="Search username">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
        <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
        <line x1="10.4" y1="10.4" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line>
      </svg>
    </button>
  </div>

  <input id="log-search" type="search" class="search" placeholder="Search username" autocomplete="off" hidden>
</section>

<section class="result-bar result-bar-log">
  <button id="log-select-all" type="button" class="chip-button">Select all</button>
  <span id="log-count" class="muted"></span>
</section>

<div id="status" class="status"></div>

<main class="list-scroll">
  <div id="list" class="list"></div>

  <!-- Two very different things empty this list, and they need opposite
       treatments: nothing left to triage is good news and gets a quiet line,
       whereas a list emptied by filters is a dead end — the way out has to be
       on screen, not something the user has to think their way back to. -->
  <div id="list-empty" class="empty" hidden>
    <p id="list-empty-text"></p>
    <button id="reset-filters" type="button" class="btn" hidden>Reset filters</button>
  </div>

  <div id="log-list" class="list"></div>
  <div id="log-empty" class="empty" hidden></div>

  <!-- Standing facts about the list, so they get their own elements below it
       rather than the status line, where every transient message would
       overwrite them — and below rather than above because both describe a
       shortfall in what you just scrolled through. -->
  <p id="cap-note" class="list-note" hidden>
    Instagram only exposes <span id="cap-count"></span> at a time — clear these, then
    <button id="refresh" type="button" class="link-inline">Refresh</button> for the next batch.
  </p>

  <!-- Still outside the Spam popover, which is what matters about its
       placement: Mutuals "none" is an enriched-only filter too, and its caveat
       must not sit behind a control the user may never open. -->
  <p id="enriched-warning" class="list-note" hidden></p>

  <div class="log-footer">
    <button id="log-older" class="btn btn-small" hidden>Load older</button>
    <button id="log-clear" class="btn btn-small btn-quiet">Clear log</button>
  </div>
  <div id="sentinel" class="sentinel"></div>
</main>

<!-- Acting is bulk-only, so the controls live in one floating bar over the
     list rather than repeating on every row. -->
<div id="toolbar" class="toolbar" hidden>
  <!-- The bar is the progress meter: --run-pct drives both the fill's width and
       the knockout layer's clip, so the coloured text can never disagree with
       the colour behind it. The line is rendered twice for that reason — once in
       --text over the card, once in --primary-text clipped to the fill. Only the
       first is exposed; the second is the same words in another colour.

       Shared by both queues. Whichever is running fills this in; when both are,
       the action wins, because it is the one writing to Instagram. -->
  <div id="run-progress" class="run-progress" hidden>
    <div class="run-fill"></div>

    <div class="run-line">
      <span class="spinner spinner-inline"></span>
      <span id="run-label"></span>
    </div>

    <div class="run-line run-line-knockout" aria-hidden="true">
      <span class="spinner spinner-inline"></span>
      <span id="run-label-knockout"></span>
    </div>

    <!-- Carries its own solid background: it is the one thing in this bar that
         must stay a legible control at every fill level, including 100%. -->
    <button id="run-stop" class="btn btn-small btn-quiet meter-stop">Stop</button>
  </div>

  <div id="bulk-bar" class="bulk-bar" hidden>
    <div class="bulk-top">
      <span id="bulk-count" class="bulk-count"></span>
      <button id="bulk-clear" class="btn btn-small btn-quiet">Clear</button>
    </div>
    <div class="bulk-actions" data-for="requests">
      <button id="bulk-accept" class="btn">Accept</button>
      <button id="bulk-accept-follow" class="btn">Accept + follow</button>
      <button id="bulk-reject" class="btn btn-reject">Reject</button>
    </div>
    <div class="bulk-actions" data-for="log">
      <button id="bulk-follow-back" class="btn">Follow back</button>
    </div>
  </div>
</div>

<dialog id="confirm" class="confirm">
  <form method="dialog">
    <h2 id="confirm-title">Confirm</h2>
    <p id="confirm-body"></p>
    <p class="confirm-warn" id="confirm-warn" hidden>Rejections cannot be undone.</p>
    <menu>
      <button value="cancel" class="btn btn-quiet">Cancel</button>
      <button value="go" id="confirm-go" class="btn">Confirm</button>
    </menu>
  </form>
</dialog>

</body>
</html>
