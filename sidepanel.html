<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request Blaster</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script type="module" src="src/panel.js"></script>
</head>
<body data-state="loading">

<!-- No title row: Chrome's own side panel header already names the extension
     directly above this, and the count lives with the list it counts. -->
<header class="panel-header">
  <nav class="modes">
    <button id="mode-requests" class="mode" data-mode="requests">Requests</button>
    <button id="mode-log" class="mode" data-mode="log" title="Everything you have accepted and rejected">Log</button>
  </nav>
</header>

<div id="banner" class="banner" hidden>
  <span id="banner-text"></span>
  <button id="banner-retry" class="icon-btn" hidden>Retry</button>
  <button id="banner-dismiss" class="icon-btn">Dismiss</button>
</div>

<div class="loading">
  <div class="spinner"></div>
  <span id="loading-text">Loading pending requests…</span>
</div>

<section class="filters">
  <div class="filter-bar">
    <label class="toggle-chip">
      <input type="checkbox" id="f-following">
      <span>Already follow</span>
    </label>

    <label class="select-chip">
      <span>Mutuals</span>
      <select id="f-mutuals" title="&quot;none&quot; needs an exact count, so it only matches rows you have loaded details for — an absent &quot;Followed by…&quot; hint does not mean zero mutuals.">
        <option value="0">any</option>
        <option value="none">none (loaded rows)</option>
        <option value="1">1+</option>
        <option value="5">5+</option>
        <option value="10">10+</option>
        <option value="50">50+</option>
        <option value="100">100+</option>
      </select>
    </label>

    <div class="popover-host">
      <button id="spam-toggle" type="button" class="chip-button" aria-expanded="false" aria-controls="spam-panel">
        <span>Spam</span><span id="spam-count" class="chip-count" hidden></span>
      </button>

      <div id="spam-panel" class="popover" hidden>
        <!-- Comes off the pending list itself, so unlike the four below it
             filters every row whether or not its details have loaded. -->
        <label class="popover-check">
          <input type="checkbox" id="f-default-pic"><span>No profile pic</span>
        </label>

        <div class="popover-divider"></div>
        <p class="popover-label">Needs loaded details</p>

        <label class="popover-check">
          <span>Followers under</span>
          <input id="f-max-followers" type="number" min="0" step="1" placeholder="—" class="num">
        </label>
        <label class="popover-check"><input type="checkbox" id="f-zero-posts"><span>0 posts</span></label>
        <label class="popover-check"><input type="checkbox" id="f-empty-bio"><span>Empty bio</span></label>
        <label class="popover-check"><input type="checkbox" id="f-bot-ratio"><span>Bot ratio</span></label>
      </div>
    </div>

    <button id="search-toggle" type="button" class="icon-toggle" aria-expanded="false" aria-controls="search" aria-label="Search username or name" title="Search username or name">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
        <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
        <line x1="10.4" y1="10.4" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line>
      </svg>
    </button>
  </div>

  <input id="search" type="search" class="search" placeholder="Search username or name" autocomplete="off" hidden>

  <!-- Outside the Spam popover on purpose: Mutuals "none" is also an
       enriched-only filter, and its caveat must not be hidden behind a
       control the user may never open. -->
  <p id="enriched-warning" class="warning" hidden></p>
</section>

<section class="result-bar">
  <label class="toggle-chip">
    <input type="checkbox" id="select-all">
    <span>Select all shown</span>
  </label>
  <span id="shown-count" class="muted"></span>
  <label class="select-chip">
    <span>Sort</span>
    <select id="sort">
      <option value="default">Following, then mutuals</option>
      <option value="newest">Newest request</option>
      <option value="followers">Most followers</option>
    </select>
  </label>
</section>

<div id="hydration" class="hydration">
  <div class="hydration-line">
    <span id="hydration-label" title="Details are follower and post counts, bio, and the exact mutual count. They need one request per person, so they load on demand rather than up front.">0 / 0 details loaded</span>
    <button id="load-batch" class="btn btn-small" title="Fetch follower counts, posts, bio and exact mutuals for the next batch of rows in view">Load details</button>
    <button id="stop-hydration" class="btn btn-small btn-quiet" hidden>Stop</button>
  </div>
  <div class="progress"><div id="hydration-bar" class="progress-fill"></div></div>
</div>

<section class="log-controls">
  <div class="filter-bar">
    <button class="log-tab" data-kind="all">All</button>
    <button class="log-tab" data-kind="accepted">Accepted</button>
    <button class="log-tab" data-kind="rejected">Rejected</button>

    <button id="log-search-toggle" type="button" class="icon-toggle" aria-expanded="false" aria-controls="log-search" aria-label="Search username" title="Search username">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
        <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
        <line x1="10.4" y1="10.4" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line>
      </svg>
    </button>
  </div>

  <input id="log-search" type="search" class="search" placeholder="Search username" autocomplete="off" hidden>
</section>

<section class="result-bar result-bar-log">
  <label class="toggle-chip">
    <input type="checkbox" id="log-select-all">
    <span>Select all shown</span>
  </label>
  <span id="log-count" class="muted"></span>
</section>

<div id="status" class="status"></div>

<main class="list-scroll">
  <div id="list" class="list"></div>
  <div id="log-list" class="list"></div>
  <div id="log-empty" class="empty" hidden></div>

  <!-- A standing fact about the data, so it gets its own element rather than
       the status line, where every transient message would overwrite it. -->
  <p id="cap-note" class="cap-note" hidden>
    Instagram only exposes <span id="cap-count"></span> at a time — clear these, then
    <button id="refresh" type="button" class="link-inline">Refresh</button> for the next batch.
  </p>

  <div class="log-footer">
    <button id="log-older" class="btn btn-small" hidden>Load older</button>
    <button id="log-clear" class="btn btn-small btn-quiet">Clear log</button>
  </div>
  <div id="sentinel" class="sentinel"></div>
</main>

<!-- Acting is bulk-only, so the controls live in one floating bar over the
     list rather than repeating on every row. -->
<div id="toolbar" class="toolbar" hidden>
  <div id="action-progress" class="action-progress" hidden>
    <span id="action-label"></span>
    <button id="action-stop" class="btn btn-small btn-quiet">Stop</button>
  </div>

  <div id="bulk-bar" class="bulk-bar" hidden>
    <div class="bulk-top">
      <span id="bulk-count" class="bulk-count"></span>
      <button id="bulk-clear" class="btn btn-small btn-quiet">Clear</button>
    </div>
    <div class="bulk-actions" data-for="requests">
      <button id="bulk-accept" class="btn">Accept</button>
      <button id="bulk-accept-follow" class="btn">Accept + follow</button>
      <button id="bulk-reject" class="btn btn-reject">Reject</button>
    </div>
    <div class="bulk-actions" data-for="log">
      <button id="bulk-follow-back" class="btn">Follow back</button>
    </div>
  </div>
</div>

<dialog id="confirm" class="confirm">
  <form method="dialog">
    <h2 id="confirm-title">Confirm</h2>
    <p id="confirm-body"></p>
    <p class="confirm-warn" id="confirm-warn" hidden>Rejections cannot be undone.</p>
    <menu>
      <button value="cancel" class="btn btn-quiet">Cancel</button>
      <button value="go" id="confirm-go" class="btn">Confirm</button>
    </menu>
  </form>
</dialog>

</body>
</html>
